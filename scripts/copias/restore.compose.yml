# Usar como sobreescritura de docker-compose.coolify.yml con un UUID nuevo.
services:
  app:
    build:
      args:
        SOURCE_COMMIT: ${COPIAS_RESTORE_SOURCE_COMMIT:?Indica la revisión de la copia}
    restart: "no"
    labels:
      coolify.applicationUuid: ${COPIAS_RESTORE_UUID:?Indica el UUID desechable}
    environment:
      SOURCE_COMMIT: ${COPIAS_RESTORE_SOURCE_COMMIT:?Indica la revisión de la copia}
  nea:
    restart: "no"
    labels:
      coolify.applicationUuid: ${COPIAS_RESTORE_UUID:?Indica el UUID desechable}
  postgres:
    restart: "no"
    labels:
      coolify.applicationUuid: ${COPIAS_RESTORE_UUID:?Indica el UUID desechable}

networks:
  default:
    internal: true
