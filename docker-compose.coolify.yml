# Coolify administra el proxy HTTPS; esta receta no levanta Caddy ni publica
# puertos del host. Construye el CRM desde este fork, no desde la imagen ajena.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      BOT_API_KEY: ${BOT_API_KEY}
      BRAIN_HEALTH_URL: http://nea:8000/health
      BRAIN_DISPATCH_URL: http://nea:8000/vocero/dispatch
      CHANNELS: ${CHANNELS:-}
      AGENDA: ${AGENDA:-}
      COPIAS_INSTANCIA_ID: ${COOLIFY_RESOURCE_UUID:-}
      MEDIA_STORE: ${MEDIA_STORE:-disco}
      MEDIA_BUCKET_ENDPOINT: ${MEDIA_BUCKET_ENDPOINT:-}
      MEDIA_BUCKET_NAME: ${MEDIA_BUCKET_NAME:-}
      MEDIA_BUCKET_REGION: ${MEDIA_BUCKET_REGION:-auto}
      MEDIA_BUCKET_KEY_ID: ${MEDIA_BUCKET_KEY_ID:-}
      MEDIA_BUCKET_SECRET: ${MEDIA_BUCKET_SECRET:-}
      ATRIBUCION: ${ATRIBUCION:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
    volumes:
      - vocero_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # El Dockerfile aplica las migraciones al arrancar y prueba /api/health.

  nea:
    image: ghcr.io/kevinrivm/nea-agent:2.0.2
    restart: unless-stopped
    environment:
      CRM_BASE_URL: http://app:3000
      CRM_BOT_API_KEY: ${BOT_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      DATABASE_SCHEMA: nea
      LLM_MODEL: ${OPENROUTER_MODEL:-z-ai/glm-5.3-flash}
      ALLOWED_WA_IDS: ${ALLOWED_WA_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vocero_pg:
  vocero_app_data:
